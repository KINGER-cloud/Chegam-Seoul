<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체감서울 — 사람들이 느끼는 오늘 날씨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#14171c; --ink2:#3b4250; --mute:#7a8291; --line:#e7e9ee; --soft:#f0f2f5;
  --blue:#2f6fdb; --blue-soft:#e8f0fd; --warm:#ef7d3c; --warm-soft:#fdeee4; --green:#1f8a6e; --red:#d9483b;
  --r:20px; --shadow:0 1px 2px rgba(20,23,28,.04),0 6px 24px rgba(20,23,28,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 80px}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.88);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.top-in{max-width:560px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:19px;letter-spacing:-.04em;display:flex;align-items:center;gap:6px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--warm))}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.tabs button{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.modebar{max-width:560px;margin:0 auto;padding:0 16px 8px;font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--ink2)}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--mute)}
.pill.live .d{background:#22a06b}
.pill.warn .d{background:var(--warm)}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
section{margin-top:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 10px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.03em}
.sec-h small{color:var(--mute);font-size:12px}
/* now card */
.now-top{display:flex;justify-content:space-between;align-items:flex-start}
.gu-btn{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:15px;padding:5px 10px 5px 12px;border-radius:999px;background:var(--soft)}
.gu-btn svg{width:14px;height:14px}
.now-time{font-size:12px;color:var(--mute);text-align:right}
.now-main{display:flex;align-items:flex-end;gap:18px;margin-top:16px}
.big{font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1}
.big small{font-size:24px;font-weight:700;vertical-align:top;margin-left:2px}
.feels{padding-bottom:6px}
.feels b{font-size:20px;font-weight:700}
.feels span{display:block;font-size:12px;color:var(--mute)}
.now-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-size:16px;font-weight:700}
.crowdline{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);font-size:14px;color:#1d3f7a;display:flex;gap:10px;align-items:center;justify-content:space-between}
.crowdline>span:first-child{flex:1;min-width:0}
.crowdline.lockd{background:var(--soft);color:var(--mute)}
/* map */
.swiper{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px 10px;scroll-padding:0 16px}
.swiper::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative}
.slide .card{padding:16px 16px 14px}
.slide-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.slide-h b{font-size:15px}
.slide-h small{font-size:11.5px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink2);background:#fff;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.map{margin-top:8px;position:relative}
.map svg{width:100%;height:auto;display:block}
.map path{stroke:#fff;stroke-width:1.4;transition:fill .35s;cursor:pointer}
.map path.sel{stroke:var(--ink);stroke-width:2.6}
.map text{font-size:12px;fill:#1e2430;text-anchor:middle;pointer-events:none;font-weight:500}
.map text.v{font-size:12.5px;font-weight:700}
.map text.inv{fill:#fff}
.legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);margin-top:6px}
.legend .bar{flex:1;height:6px;border-radius:999px}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:7px;height:7px;border-radius:999px;background:#cfd3da;transition:all .25s}
.dots button.on{width:20px;background:var(--ink)}
.swipe-hint{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 0;font-size:12.5px;color:var(--mute)}
.swipe-hint button{color:var(--blue);font-weight:500;font-size:13px}
.lockov{position:absolute;inset:0;border-radius:var(--r);background:rgba(255,255,255,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px}
.lockov b{font-size:16px}
.lockov p{font-size:13px;color:var(--mute)}
.gudetail{margin-top:10px;font-size:13.5px;color:var(--ink2);background:#fff;border-radius:14px;padding:12px 14px;border:1px solid var(--line);display:none}
.gudetail.show{display:block}
.gudetail .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.gudetail .kv{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;color:var(--mute);font-size:12.5px}
.gudetail .kv b{color:var(--ink);font-weight:600}
.link{color:var(--blue);font-weight:500;font-size:13px}
/* quiz */
.quiz .card{padding:22px 20px}
.qprog{display:flex;gap:4px;margin-bottom:18px}
.qprog span{flex:1;height:4px;border-radius:999px;background:var(--soft)}
.qprog span.on{background:var(--ink)}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.qtag{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.qback{font-size:13px;color:var(--mute)}
.q h3{font-size:21px;line-height:1.38;font-weight:700;letter-spacing:-.035em;word-break:keep-all}
.q .sub{font-size:13px;color:var(--mute);margin-top:6px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.ox button{border-radius:18px;padding:18px 10px 14px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s,border-color .2s,background .2s}
.ox button:active{transform:scale(.97)}
.ox .sym{width:44px;height:44px}
.ox small{font-size:13px;color:var(--ink2);font-weight:500}
.ox button.pick-o{border-color:var(--blue);background:var(--blue-soft)}
.ox button.pick-x{border-color:var(--warm);background:var(--warm-soft)}
.follow{margin-top:14px;padding:14px;border-radius:14px;background:var(--soft)}
.follow p{font-size:13.5px;font-weight:500;margin-bottom:10px}
.follow .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.follow .two button{padding:11px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:500}
.gugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.gugrid button{padding:9px 2px;border-radius:12px;border:1px solid var(--line);font-size:13px;background:#fff}
.gugrid button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{margin-top:16px}
.field label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px}
.field label small{font-weight:400;color:var(--mute);font-size:12px}
textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;background:#fff;line-height:1.5;font-size:15px}
textarea:focus{outline:none;border-color:var(--ink)}
.btn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;padding:15px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:15.5px;margin-top:18px}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;margin-top:0;border-radius:12px}
.aiv{margin-top:14px;padding:14px;border-radius:14px;font-size:13.5px}
.aiv.ok{background:#e9f6f1;color:#145c49}
.aiv.bad{background:#fdeceb;color:#8c2a20}
.aiv.load{background:var(--soft);color:var(--ink2);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid #c9ced6;border-top-color:var(--ink);animation:sp 0.8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.mine{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mine .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.tag.o{background:var(--blue-soft);color:#1d4fa8}
.tag.x{background:var(--warm-soft);color:#a24a14}
.tag.ai{background:#e9f6f1;color:#145c49}
.tag.sim{background:#f3eefc;color:#5a3d99}
.tag.bad{background:#fdeceb;color:#8c2a20}
/* ootd */
.ootd{background:linear-gradient(160deg,#ffffff 0%,#ffffff 55%,#f3f6fc 100%)}
.ootd-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ootd-h h3{font-size:20px;font-weight:800;letter-spacing:-.04em;line-height:1.3;word-break:keep-all}
.ootd-h .t{font-size:13px;color:var(--mute);margin-top:4px}
.ootd-temp{text-align:right;flex:0 0 auto}
.ootd-temp b{font-size:30px;font-weight:800;letter-spacing:-.04em}
.ootd-temp span{display:block;font-size:11.5px;color:var(--mute)}
.wear{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.wear div{background:var(--soft);border-radius:14px;padding:11px 13px}
.wear span{display:block;font-size:11.5px;color:var(--mute)}
.wear b{font-size:14.5px;font-weight:600;word-break:keep-all}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.add{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff}
.add.hl{border-color:var(--blue);color:var(--blue);font-weight:600}
.why{margin-top:14px;font-size:12.5px;color:var(--mute);line-height:1.6}
.worn{margin-top:12px;font-size:13px;color:var(--ink2)}
/* results carousel */
.rs{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-padding:0 16px}
.rs::-webkit-scrollbar{display:none}
.rc{flex:0 0 84%;scroll-snap-align:start;padding:18px}
.rc .qn{font-size:12px;color:var(--mute);font-weight:500}
.rc h4{font-size:16px;font-weight:700;line-height:1.4;margin-top:4px;letter-spacing:-.03em;word-break:keep-all;min-height:45px}
.rc .pct{font-size:40px;font-weight:800;letter-spacing:-.05em;margin-top:10px;line-height:1}
.rc .pct small{font-size:14px;font-weight:500;color:var(--mute);margin-left:6px;letter-spacing:-.01em}
.sbar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin-top:14px;background:var(--soft)}
.sbar i{display:block;height:100%;transition:width .5s}
.sleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--ink2)}
.sleg span{display:inline-flex;align-items:center;gap:5px}
.sleg em{width:8px;height:8px;border-radius:3px;display:inline-block}
.mygu{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.mygu .sbar{height:7px;margin-top:6px}
.voice{padding:11px 0;border-bottom:1px solid var(--line)}
.voice:last-child{border-bottom:0}
.voice p{font-size:14px;line-height:1.5}
.voice .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:12px;color:var(--mute)}
.vlist{max-height:330px;overflow-y:auto;margin-top:8px}
.aisum{margin-top:12px;padding:14px;border-radius:14px;background:#f5f7fb;font-size:13.5px;line-height:1.6}
.aisum b{display:block;font-size:14.5px;margin-bottom:4px}
.aisum ul{padding-left:18px;margin-top:6px}
.rhint{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
/* community */
.topics{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding:0 16px;align-items:flex-start}
.topics::-webkit-scrollbar{display:none}
.topic{flex:0 0 78%;scroll-snap-align:start;padding:16px;text-align:left}
.topic .k{font-size:11.5px;font-weight:700;color:var(--blue)}
.topic h4{font-size:15.5px;font-weight:700;margin-top:4px;line-height:1.4;word-break:keep-all}
.topic p{font-size:12.5px;color:var(--mute);margin-top:6px}
.compose .chips{margin-bottom:10px}
.compose-f{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--mute)}
.feedf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 2px 8px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);white-space:nowrap}
.toggle input{accent-color:var(--ink)}
.post{padding:16px 18px;margin-top:8px}
.post .ph{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute)}
.post .ph b{color:var(--ink);font-weight:600;font-size:13px}
.post p{margin-top:8px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.post .del{font-size:12px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);font-size:13.5px;padding:28px 10px}
.lockcard{text-align:center;padding:30px 20px}
.lockcard b{display:block;font-size:16px;margin:8px 0 4px}
.lockcard p{font-size:13.5px;color:var(--mute)}
.simrow{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding:14px 16px;border-radius:16px;border:1px dashed #cfd3da;font-size:12.5px;color:var(--mute);gap:12px}
.simrow b{color:var(--ink2);font-weight:600;display:block;font-size:13px}
.switch{position:relative;width:42px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:#d5d9e0;transition:.2s}
.switch span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--ink)}
.switch input:checked+span:before{transform:translateX(18px)}
.foot{margin-top:28px;font-size:11.5px;color:var(--mute);line-height:1.7;padding:0 4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,23,28,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px 28px;max-height:80vh;overflow:auto}
.sheet h3{font-size:17px;font-weight:700}
[hidden]{display:none!important}
.photo-row{display:flex;gap:6px;margin-top:10px}
.pbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:500;cursor:pointer;position:relative;overflow:hidden}
.pbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.ppreview{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;background:var(--soft);max-width:220px}
.ppreview img{display:block;width:100%;height:auto}
.ppreview button{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(20,23,28,.7);color:#fff;font-size:15px;line-height:28px}
.post .pimg{margin-top:10px;border-radius:14px;overflow:hidden;background:var(--soft);cursor:zoom-in}
.post .pimg img{display:block;width:100%;max-height:380px;object-fit:cover;min-height:120px}
.gallery{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gthumb{flex:0 0 112px;height:150px;border-radius:16px;overflow:hidden;background:var(--soft);position:relative}
.gthumb img{width:100%;height:100%;object-fit:cover;display:block}
.gthumb span{position:absolute;left:6px;bottom:6px;font-size:11px;color:#fff;background:rgba(20,23,28,.55);padding:2px 7px;border-radius:999px}
.gadd{flex:0 0 112px;height:150px;border-radius:16px;border:1.5px dashed #cfd3da;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;color:var(--mute);position:relative;overflow:hidden;cursor:pointer}
.gadd input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.gadd b{font-size:22px;color:var(--ink2);font-weight:400}
.sheet img{display:block;width:100%;border-radius:14px;margin-top:12px}
.busy{opacity:.55;pointer-events:none}
@media (min-width:600px){ .rc{flex-basis:300px} .topic{flex-basis:300px} }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><i></i>체감서울</div>
    <nav class="tabs" id="tabs">
      <button data-tab="home" class="on">오늘</button>
      <button data-tab="community">커뮤니티</button>
    </nav>
  </div>
  <div class="modebar" id="modeBar"></div>
</header>

<div class="wrap">
  <!-- ===== HOME ===== -->
  <div id="tab-home">
    <section><div class="card" id="nowCard"></div></section>

    <div class="sec-h"><h2 id="mapTitle">서울 날씨 지도</h2><div class="dots" id="mapDots"><button class="on" aria-label="기상청 지도"></button><button aria-label="사람들 지도"></button></div></div>
    <div class="swiper" id="mapSwiper">
      <div class="slide"><div class="card">
        <div class="slide-h"><b>기상청 관측</b><small id="kmaSrc"></small></div>
        <div class="chips" id="kmaChips"></div>
        <div class="map" id="mapKma"></div>
        <div class="legend" id="legKma"></div>
      </div></div>
      <div class="slide"><div class="card">
        <div class="slide-h"><b>사람들이 느끼는 날씨</b><small id="crowdSrc"></small></div>
        <div class="chips" id="crowdChips"></div>

/* ================= 체감온도 (기상청 산출식) ================= */
// 겨울철(10~4월): 기온 10℃ 이하, 풍속 1.3m/s 이상일 때 바람냉각 체감온도
// 여름철(5~9월): 습구온도(Stull) 기반 체감온도
function stullTw(T, RH){
  return T*Math.atan(0.151977*Math.sqrt(RH+8.313659)) + Math.atan(T+RH) - Math.atan(RH-1.67633)
    + 0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH) - 4.686035;
}
function feelsLike(T, RH, wsd, month){
  if (month >= 5 && month <= 9){ const Tw = stullTw(T,RH); return -0.2442 + 0.55399*Tw + 0.45535*T - 0.0022*Tw*Tw + 0.00278*Tw*T + 3.0; }
  const V = wsd*3.6;
  if (T <= 10 && V >= 4.8) return 13.12 + 0.6215*T - 11.37*Math.pow(V,0.16) + 0.3965*Math.pow(V,0.16)*T;
  return T;
}

// 실제 연동: 공공데이터포털 기상청 초단기실황(getUltraSrtNcst) — T1H(기온), REH(습도), RN1(1시간 강수), WSD(풍속)
// 브라우저에서 직접 호출은 서비스키 노출·CORS 문제가 있어, 백엔드(또는 예약 작업)가 수집해 db의 weather/current 문서에 넣으면
// 이 페이지가 자동으로 그 값을 사용합니다. 문서 형식: {updatedAt, source, gu:{"강남구":{t,reh,rn1,wsd}, ...}}
function demoWeather(){
  const now = seoulParts(); const out = {};
  const base = 8 + 5*Math.cos((now.hour + now.minute/60 - 15)/24*2*Math.PI);
  const wet = hash("rain"+now.date) < 0.35; // 날에 따라 서쪽 약한 비
  GEO.gu.forEach(g => {
    const r = rng(g.n + now.date + now.hour);
    const north = (250 - g.c[1]) / 250, west = (300 - g.c[0]) / 300;
    const center = 1 - Math.min(1, Math.hypot(g.c[0]-300, g.c[1]-240)/260);
    const t = base - north*1.3 + center*0.7 + (r()-.5)*0.8;
    const reh = 56 + (RIVER.has(g.n)?9:0) + (r()-.5)*8 + (wet && west>0.3 ? 14 : 0);
    const wsd = 1.6 + Math.max(0,west)*1.3 + (RIVER.has(g.n)?1.1:0) + r()*0.9;
    const rn1 = wet && west > 0.35 ? Math.round((0.3 + r()*1.4)*10)/10 : 0;
    out[g.n] = {t:+t.toFixed(1), reh:Math.round(clamp(reh,20,99)), wsd:+wsd.toFixed(1), rn1};
  });
  return {source:"시연 데이터", updatedAt: Date.now(), gu: out, demo:true};
}
function withFeels(w){
  const m = seoulParts().month;
  Object.values(w.gu).forEach(v => { v.feels = +feelsLike(v.t, v.reh, v.wsd, m).toFixed(1); });
  return w;
}

function cleanPost(p, uid){
  if (!p || typeof p !== "object" || !GU.includes(p.gu)) return null;
  const text = String(p.text||"").slice(0,300);
  let photo = null;
  if (p.photo && typeof p.photo === "object"){
    if (typeof p.photo.asset === "string" && /^[A-Za-z0-9_-]{1,128}$/.test(p.photo.asset)) photo = {asset:p.photo.asset};
    else if (typeof p.photo.doc === "string" && /^[A-Za-z0-9_-]{1,64}$/.test(p.photo.doc)) photo = {doc:p.photo.doc};

function hex2rgb(h){ h=h.replace("#",""); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); }
function ramp(stops, t){
  t = clamp(t,0,1);
  for (let i=1;i<stops.length;i++){
    if (t <= stops[i][0]){
      const [t0,c0]=stops[i-1],[t1,c1]=stops[i], k=(t-t0)/(t1-t0||1), a=hex2rgb(c0), b=hex2rgb(c1);
      return `rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join(",")})`;
    }
  }
  return stops[stops.length-1][1];
}

/* ================= AI 검증 ================= */
function heuristic(text, draft){
  const t = (text.wear + " " + text.local);
  const words = ["입","옷","니트","코트","패딩","자켓","재킷","가디건","셔츠","티","맨투맨","후드","바지","청바지","치마","원피스","목도리","장갑","히트텍","트렌치","바람막이","춥","추워","더워","덥","쌀쌀","따뜻","선선","시원","바람","비","우산","습","눅눅","건조","날씨","적당","괜찮"];
  const hits = words.filter(w => t.includes(w)).length;
  const valid = hits >= 1 && t.replace(/[ㅋㅎㅠㅜ\s.!?~]/g,"").length >= 4;
  const clothes = ["롱패딩","숏패딩","패딩","코트","트렌치코트","트렌치","자켓","재킷","가디건","니트","맨투맨","후드티","셔츠","긴팔티","반팔","청바지","면바지","슬랙스","치마","원피스","목도리","장갑","히트텍","바람막이","플리스","조끼"];
  const found = []; clothes.forEach(c => { if (t.includes(c) && !found.some(f => f.includes(c) || c.includes(f))) found.push(c); });
  const humid = /습|눅눅|끈적|후덥/.test(t) ? "humid" : /건조|바싹|입술/.test(t) ? "dry" : t.trim() ? "normal" : "unknown";
  const comfort = /추워|춥|쌀쌀|시려|오들/.test(t) ? "cold" : /더워|덥|땀/.test(t) ? "warm" : /적당|딱|괜찮|좋/.test(t) ? "ok" : "unknown";
  return {status: valid ? "heuristic" : "rejected", valid, reason: valid ? "" : "날씨나 옷차림에 대한 내용을 찾지 못했어요.", comfort, humid, wind: /바람/.test(t) ? "strong" : "unknown", clothing: found.slice(0,5), consistency:"unknown", summary:""};
}
async function aiVerify(draft, gu){
  const w = W.gu[gu];
  if (!S.sample) return heuristic(draft.text, draft);
  const prompt = `너는 서울 체감날씨 커뮤니티의 응답 검증기다. 사용자가 남긴 서술형 답변이 '지금 날씨에 대한 실제 체감이나 옷차림'에 관한 진지한 내용인지 판정하고, 통계에 쓸 정보를 뽑아라.
장난, 욕설, 광고, 무의미한 글자(예: ㅋㅋㅋ, asdf), 날씨·옷과 무관한 내용은 valid=false.
사용자의 O/X 답변과 서술형 내용이 서로 모순되면 consistency를 "conflict"로 표시하라(예: '체감 비슷해요'라고 답했는데 글에는 '얼어 죽겠다').

[상황] 서울 ${gu}, ${seoulParts().hour}시. 기상청 기온 ${w.t}°C, 체감 ${w.feels}°C, 습도 ${w.reh}%, 1시간 강수 ${w.rn1}mm, 풍속 ${w.wsd}m/s.
[O/X 답변] 체감온도가 예보와 비슷: ${draft.ox.temp?"예":"아니오("+(draft.tempDir==="hot"?"더 덥다":"더 춥다")+")"} / 우산 필요: ${draft.ox.rain?"예":"아니오"} / ${CLOTH_Q[clothKey()].short} 필요: ${draft.ox.cloth?"예":"아니오"}
[서술형1: 입은 옷과 느낌] ${draft.text.wear}
[서술형2: 동네 공기] ${draft.text.local || "(없음)"}

JSON 객체 하나만 출력: {"valid":true|false,"reason":"판정 이유 한 문장(한국어)","comfort":"cold|cool|ok|warm|hot|unknown","humid":"humid|normal|dry|unknown","wind":"strong|normal|calm|unknown","clothing":["글에 나온 옷 이름을 한국어 일반명사로, 최대 5개"],"consistency":"consistent|conflict|unknown","summary":"20자 이내 한국어 요약"}`;
  try {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 30000);
    const v = await S.sample.json(prompt, {modelTier:"quick", signal: ctrl.signal});
    clearTimeout(timer);
    if (!v || typeof v.valid !== "boolean") throw new Error("bad");
    return {status: v.valid ? "verified" : "rejected", valid: v.valid, reason: String(v.reason||"").slice(0,120), comfort: v.comfort||"unknown", humid: v.humid||"unknown", wind: v.wind||"unknown",
      clothing: Array.isArray(v.clothing) ? v.clothing.map(x=>String(x).slice(0,12)).slice(0,5) : [], consistency: v.consistency||"unknown", summary: String(v.summary||"").slice(0,40)};

}
async function submit(force){

function topicCards0(){
  const list = allAnswers(), st = stats(list), ck = CLOTH_Q[clothKey()];
  if (!st.n) return [{k:"오늘의 이야기", t:"오늘 날씨, 예보랑 비슷했나요?", p:"첫 이야기를 남겨주세요", topic:"기온"}];

  const out = [];
  out.push({k:"체감 기온", t:`${pct(st.temp.cold,st.n)}%가 ‘예보보다 춥다’고 했어요. 여러분 동네는요?`, p:`비슷하다 ${pct(st.temp.o,st.n)}% · 덥다 ${pct(st.temp.hot,st.n)}%`, topic:"기온"});
  if (coldest) out.push({k:"동네 비교", t:`오늘 사람들이 가장 춥다고 느낀 곳은 ${coldest} (${cv}°)`, p:"왜 그럴까요? 바람, 지형, 한강…", topic:"기온"});
  out.push({k:"옷차림", t:`${ck.short}, ${pct(st.cloth.o,st.cloth.o+st.cloth.x)}%가 필요하다고 했어요. 오늘 뭐 입으셨어요?`, p:"OOTD 공유하기", topic:"옷차림"});
  out.push({k:"비·우산", t: st.rain.o/st.n >= .3 ? `${pct(st.rain.o,st.n)}%가 우산이 필요하다네요. 지금 비 오는 곳은?` : "오늘은 대부분 우산 없이도 괜찮대요. 맞나요?", p:"실시간 비 소식 나누기", topic:"비·우산"});

  return out;
}

  const draft = ta0 ? ta0.value : "";
  const photos = allPosts().filter(p => p.photo).slice(0, 20);
  el.innerHTML = `
    <div class="sec-h"><h2>오늘의 이야깃거리</h2><small>응답 결과에서 뽑았어요</small></div>
    <div class="topics">${topicCards().map(t=>`<button class="card topic" data-topic="${t.topic}" data-prompt="${esc(t.t)}"><div class="k">${t.k}</div><h4>${esc(t.t)}</h4><p>${esc(t.p)}</p></button>`).join("")}</div>
    <div class="sec-h"><h2>오늘의 OOTD 사진</h2><small>${photos.length}장</small></div>
    <div class="gallery">
      <label class="gadd"><b>＋</b>내 OOTD 찍기<input type="file" accept="image/*" capture="environment" data-photo aria-label="카메라로 OOTD 찍기"></label>
      ${photos.map(p => `<button class="gthumb" data-view="${esc(p.uid)}|${esc(p.id)}">${photoImg(p)}<span>${esc(shortGu(p.gu))}${p.sim?" · 가상":""}</span></button>`).join("")}
    </div>
    <div class="sec-h"><h2>이야기 남기기</h2><small>${esc(S.gu)} 주민으로 표시돼요</small></div>
    <div class="card compose ${S.posting?"busy":""}" id="composeCard">
      <div class="chips">${TOPICS.map(t=>`<button class="chip ${S.composeTopic===t?"on":""}" data-ct="${t}">${t}</button>`).join("")}</div>
      <textarea id="pText" maxlength="300" placeholder="${S.pending?"사진에 한마디 남겨주세요 (선택)":"지금 내 동네 날씨, 옷차림 이야기를 들려주세요"}">${esc(draft)}</textarea>
      ${S.pending ? `<div class="ppreview"><img src="${S.pending.url}" alt="올릴 사진 미리보기"><button data-unphoto aria-label="사진 빼기">×</button></div>` : ""}
      <div class="photo-row">
        <label class="pbtn">📷 카메라<input type="file" accept="image/*" capture="environment" data-photo aria-label="카메라로 찍기"></label>
        <label class="pbtn">🖼 앨범<input type="file" accept="image/*" data-photo aria-label="앨범에서 고르기"></label>
      </div>
      <div class="compose-f"><span>이름 없이 구 단위로만 표시돼요</span><button class="btn sm" data-post>${S.posting?"올리는 중…":"올리기"}</button></div>
    </div>
    <div class="feedf"><div class="chips">${["전체"].concat(TOPICS).map(t=>`<button class="chip ${S.topic===t?"on":""}" data-ft="${t}">${t}</button>`).join("")}</div>
      <label class="toggle"><input type="checkbox" id="onlyGu" ${S.onlyMyGu?"checked":""}>우리 구</label></div>
    <div>${posts.length ? posts.map(p => `<div class="card post"><div class="ph"><span><b>${esc(p.gu)} 주민</b> · ${esc(p.topic)} · ${relTime(p.ts)} ${p.sim?'<span class="tag sim">가상</span>':""}</span>${(p.uid===S.uid||p.uid==="me")&&!p.sim?`<button class="del" data-del="${esc(p.id)}">삭제</button>`:""}</div>${p.text?`<p>${esc(p.text)}</p>`:""}${p.photo?`<div class="pimg" data-view="${esc(p.uid)}|${esc(p.id)}">${photoImg(p)}</div>`:""}</div>`).join("") : `<div class="empty">아직 이 주제의 이야기가 없어요.<br>첫 이야기를 남겨보세요.</div>`}</div>`;
  if (hadFocus){ const n = $("#pText"); n.focus(); try { n.setSelectionRange(sel[0], sel[1]); } catch(e){} }
}
/* ---- 사진: 카메라/앨범 → 압축 → 업로드 ---- */
function loadImage(blob){
  return new Promise((res, rej) => { const u = URL.createObjectURL(blob), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("decode")); }; i.src = u; });
}
async function compress(blob, maxSide, q){
  const img = await loadImage(blob);
  const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  return {canvas:c, blob: await new Promise(r => c.toBlob(r, "image/jpeg", q))};
}
async function pickPhoto(file){
  if (!file) return;
  if (!/^image\//.test(file.type||"image/")){ toast("사진 파일만 올릴 수 있어요"); return; }
  if (file.size > 25*1024*1024){ toast("25MB 이하 사진만 올릴 수 있어요"); return; }
  try {
    const {blob} = await compress(file, 1280, .85);
    if (!blob) throw new Error("encode");
    if (S.pending) URL.revokeObjectURL(S.pending.url);
    S.pending = {blob, url: URL.createObjectURL(blob)};
    S.composeTopic = "OOTD";
    if (S.tab !== "community") setTab("community");
    renderCommunity();
    const card = $("#composeCard"); if (card) card.scrollIntoView({behavior:"smooth", block:"center"});
  } catch(e){ toast("이 사진 형식은 열 수 없어요. JPG·PNG로 다시 시도해주세요"); }
}
async function blobToDataUrl(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function smallDataUrl(blob){
  for (const [side, q] of [[900,.75],[720,.7],[560,.62],[420,.55]]){
    const {blob:b} = await compress(blob, side, q); const d = await blobToDataUrl(b);
    if (d.length < 200000) return d;
  }
  throw new Error("too_big");
}
async function uploadPhoto(id){
  const blob = S.pending.blob;
  if (S.assets){
    try { const r = await S.assets.upload(blob); if (r && r.id) return {asset:r.id}; } catch(e){ console.warn("asset upload", e); }
  }
  const data = await smallDataUrl(blob);
  if (S.live){ await S.db.doc(`posts/${S.uid}/photos/${id}`).set({data, ts:Date.now()}); return {doc:id}; }
  return {data};
}
async function addPost(){
  if (S.posting) return;
  const ta = $("#pText"), text = (ta.value||"").trim();
  if (!S.pending && text.length < 2){ toast("내용을 입력하거나 사진을 올려주세요"); return; }
  const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const item = {id, topic:S.composeTopic, text:text.slice(0,300), gu:S.gu, ts:Date.now()};
  S.posting = true; renderCommunity();
  try {
    if (S.pending) item.photo = await uploadPhoto(id);
    const ok = await savePosts([item].concat(S.myPosts).slice(0,30));
    if (ok === false) throw new Error("save");
    if (S.pending){ URL.revokeObjectURL(S.pending.url); S.pending = null; }
    const t = $("#pText"); if (t) t.value = "";
    toast(item.photo ? "OOTD 사진을 올렸어요" : "이야기를 올렸어요");
  } catch(e){
    toast(e && e.message==="too_big" ? "사진이 너무 커요. 다른 사진으로 시도해주세요" : "올리지 못했어요. 잠시 후 다시 시도해주세요");
  }
  S.posting = false; renderCommunity();
}
async function deletePost(id){
  const p = S.myPosts.find(x => x.id === id); if (!p) return;
  const ok = await savePosts(S.myPosts.filter(x => x.id !== id));
  if (ok === false) return;
  if (p.photo && p.photo.asset && S.assets){ try { await S.assets.delete(p.photo.asset); } catch(e){} }
  if (p.photo && p.photo.doc && S.live){ try { await S.db.doc(`posts/${S.uid}/photos/${p.photo.doc}`).delete(); } catch(e){} }
  toast("삭제했어요");
}
function viewPost(key){
  const [uid, id] = key.split("|");
  const p = allPosts().find(x => x.uid === uid && x.id === id); if (!p) return;
  $("#sheet").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(p.gu)} 주민의 ${esc(p.topic)}</h3><button class="link" data-close>닫기</button></div>
    <div style="font-size:12.5px;color:var(--mute);margin-top:2px">${relTime(p.ts)}${p.sim?" · 가상":""}</div>
    ${p.photo?photoImg(p):""}${p.text?`<p style="margin-top:12px;font-size:15px;white-space:pre-wrap">${esc(p.text)}</p>`:""}`;
  $("#sheetBg").classList.add("show");
}

/* ================= 모드 표시 ================= */
function renderMode(){
  const parts = [];
  if (S.loading) parts.push(`<span class="pill"><span class="d"></span>공유 데이터 연결 중…</span>`);
  else if (S.live) parts.push(`<span class="pill live"><span class="d"></span>실시간 공유 중</span>`);
  else parts.push(`<span class="pill warn"><span class="d"></span>체험 모드 · 응답이 이 브라우저에만 저장돼요</span>`);
  if (S.timedOut && S.live) parts.push(`<span class="pill warn"><span class="d"></span>데이터가 늦게 오고 있어요</span>`);
  parts.push(`<span class="pill"><span class="d" style="background:${W.demo?"#b9a6e6":"#22a06b"}"></span>${W.demo?"날씨: 시연 데이터":"날씨: "+esc(W.source||"기상청")}</span>`);
  parts.push(`<span class="pill"><span class="d" style="background:${S.sample?"#22a06b":"#c9ced6"}"></span>${S.sample?"AI 검증 켜짐":"AI 검증: 자동 분류"}</span>`);
  $("#modeBar").innerHTML = parts.join("");
  $("#foot").innerHTML = `체감온도는 기상청 산출식(겨울철 바람냉각, 여름철 습구온도 기반)으로 계산해요. ${W.demo ? "현재 기온·습도·강수·바람은 기상청 초단기실황과 같은 형식의 <b>시연 데이터</b>예요. 공공데이터포털 API 키를 연결한 수집기가 값을 넣으면 자동으로 실제 관측값으로 바뀌어요." : ""} ‘사람들 체감’은 기상청 체감에 ‘더 춥다/더 덥다’ 응답 비율을 반영해 ±3° 범위에서 보정한 값이에요.`;
}

/* ================= 전체 렌더 ================= */
function renderAll(){
  renderMode(); renderNow(); renderKmaMap(); renderCrowdMap(); renderSwipeHint(); renderGuDetail();
  // 서술형을 쓰는 중에 다른 사람 응답이 들어와도 입력창을 다시 그리지 않는다
  const ae = document.activeElement;
  if (!(ae && ae.tagName === "TEXTAREA" && ae.closest("#quiz"))) renderQuiz();
  renderOotd(); renderResults();
  $("#afterArea").style.display = "";
  $("#simRow").style.display = unlocked() ? "" : "none";
  if (S.tab === "community") renderCommunity();
}
async function resetAll(){
  if (S.live){
    try { await S.db.doc("answers/"+S.uid).delete(); } catch(e){}
    try { await S.db.doc(`answers/${S.uid}/days/${TODAY}`).delete(); } catch(e){}
  }
  try { localStorage.removeItem("cs.my"); localStorage.removeItem("cs.gu"); } catch(e){}
  S.answers = S.answers.filter(a => a.uid !== S.uid && a.uid !== "me");
  S.my = null; S.gu = null; S.sel = null; S.draft = null; S.step = 0; S.editing = false; S.verdict = null; S.aiSummary = null;
  setTab("home"); renderAll(); $("#mapSwiper").scrollTo({left:0});
  toast("처음 화면으로 돌아왔어요");
}
function checkDay(){
  const d = seoulParts().date; if (d === TODAY) return;
  TODAY = d; S.simData = null; S.aiSummary = null; S.editing = false; S.draft = null; S.step = 0;
  W = withFeels(demoWeather());
  if (S.live) subscribeAnswers(); else S.answers = [];
  renderAll(); toast("날짜가 바뀌어 오늘의 질문이 새로 열렸어요");
}
setInterval(checkDay, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); });
function setTab(t){
  S.tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab===t));
  $("#tab-home").hidden = t !== "home"; $("#tab-community").hidden = t !== "community";
  if (t === "community") renderCommunity();
  window.scrollTo({top:0});
}
function openGuSheet(){
  $("#sheet").innerHTML = `<h3>내 동네 선택</h3><p style="font-size:13px;color:var(--mute);margin-top:4px">구 단위로 날씨와 사람들 체감을 보여드려요.</p><div class="gugrid">${GU.map(g=>`<button data-sgu="${g}" class="${S.gu===g?"on":""}">${shortGu(g)}</button>`).join("")}</div>`;
  $("#sheetBg").classList.add("show");
}
function setGu(g){
  S.gu = g; lsSet("cs.gu", g); S.sel = g; S.aiSummary = null;
  renderAll();
}

/* ================= 이벤트 ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("button, path, [data-topic], [data-view]"); if (!t) return;
  const d = t.dataset;
  if (t.matches("#tabs button")) return setTab(d.tab);
  if (t.closest("#kmaChips") && d.k){ S.kmaMetric = d.k; return renderKmaMap(); }
  if (t.closest("#crowdChips") && d.k){ S.crowdMetric = d.k; return renderCrowdMap(); }
  if (t.tagName === "path" && d.gu){ S.sel = S.sel === d.gu ? null : d.gu; renderKmaMap(); renderCrowdMap(); renderGuDetail(); return; }
  if (d.go != null) return goSlide(+d.go);
  if (t.closest("#mapDots")) return goSlide([...t.parentNode.children].indexOf(t));
  if (d.setgu) return setGu(d.setgu);
  if (d.pickgu != null) return openGuSheet();
  if (d.sgu){ $("#sheetBg").classList.remove("show"); return setGu(d.sgu); }
  // quiz
  if (t.closest("#quiz")){
    if (d.gu){ S.gu = d.gu; lsSet("cs.gu", d.gu); S.step = 0; renderAll(); return; }
    if (d.back != null){ S.step--; S.verdict = null; return renderQuiz(); }
    if (d.cancel != null){ S.editing = false; S.draft = null; S.step = 0; return renderAll(); }
    if (d.ox != null){
      const steps = questions(S.gu); const q = steps[S.step - (!S.gu?1:0)];
      S.draft.ox[q.id] = d.ox === "1";
      if (q.follow && d.ox === "0"){ S.draft.tempDir = null; return renderQuiz(); }
      if (q.follow) S.draft.tempDir = null;
      renderQuiz(); return setTimeout(advance, 180);
    }
    if (d.dir){ S.draft.tempDir = d.dir; renderQuiz(); return setTimeout(advance, 180); }
    if (d.submit != null) return submit(false);
    if (d.force != null) return submit(true);
    if (d.reset != null) return resetAll();
    if (d.edit != null){
      const a = S.my; S.editing = true; S.step = 0; S.verdict = null;
      S.draft = {ox:{...a.ox}, tempDir:a.tempDir, text:{...a.text}};
      renderAll(); $("#quiz").scrollIntoView({behavior:"smooth", block:"start"}); return;
    }
  }
  if (d.vs){ S.voiceScope = d.vs; S.aiSummary = null; return renderResults(); }
  if (d.aisum != null) return runAiSummary();
  if (d.gohome != null){ setTab("home"); setTimeout(()=>$("#quizHead").scrollIntoView({behavior:"smooth"}),50); return; }
  // community
  if (d.topic){ S.composeTopic = d.topic; S.topic = d.topic; renderCommunity(); const ta = $("#pText"); ta.placeholder = d.prompt || ta.placeholder; ta.focus(); return; }
  if (d.ct){ S.composeTopic = d.ct; return renderCommunity(); }
  if (d.ft){ S.topic = d.ft; return renderCommunity(); }
  if (d.post != null) return addPost();
  if (d.del) return deletePost(d.del);
  if (d.unphoto != null){ if (S.pending) URL.revokeObjectURL(S.pending.url); S.pending = null; return renderCommunity(); }
  if (d.view) return viewPost(d.view);
  if (d.close != null){ $("#sheetBg").classList.remove("show"); return; }
});
document.addEventListener("change", e => {
  if (e.target.matches("input[data-photo]")){ const f = e.target.files && e.target.files[0]; e.target.value = ""; pickPhoto(f); return; }
  if (e.target.id === "onlyGu"){ S.onlyMyGu = e.target.checked; renderCommunity(); }
  if (e.target.id === "simToggle"){ S.sim = e.target.checked; lsSet("cs.sim", S.sim); S.aiSummary = null; renderAll(); }
});
$("#sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") e.currentTarget.classList.remove("show"); });
function goSlide(i){ const sw = $("#mapSwiper"), sl = sw.querySelectorAll(".slide")[i]; if (sl) sw.scrollTo({left: sl.offsetLeft - sw.firstElementChild.offsetLeft, behavior:"smooth"}); }
$("#mapSwiper").addEventListener("scroll", () => {
  const sw = $("#mapSwiper"), sl = sw.querySelectorAll(".slide"), step = (sl[1].offsetLeft - sl[0].offsetLeft) || 1, i = Math.round(sw.scrollLeft / step);
  if (i !== S.slide){ S.slide = i; renderSwipeHint(); }
}, {passive:true});

/* ================= 연결 ================= */
function startLocal(){
  S.live = false; S.loading = false;
  const my = lsGet("cs.my", null); if (my) { S.my = my; if (my.date === TODAY) S.answers = [{...my, uid:"me"}]; }
  S.myPosts = lsGet("cs.posts", []); S.posts = S.myPosts.map(p => cleanPost(p, "me")).filter(Boolean);
  renderAll();
}
function subscribeAnswers(timer){
  if (S.unsubAnswers) S.unsubAnswers();
  S.unsubAnswers = S.db.collection("answers").where("date","==",TODAY).onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); S.timedOut = false; }
    S.answers = snap.docs.map(d => cleanAnswer(d.data(), d.id)).filter(Boolean);
    const me = snap.docs.find(d => d.id === S.uid); if (me) S.my = me.data();
    renderAll();
  }, err => { clearTimeout(timer); S.timedOut = false; console.warn(err); renderMode(); });
}
async function connect(){
  const C = window.claude;
  if (!C || typeof C.use !== "function"){ startLocal(); return; }
  try { C.use("sample").then(s => { S.sample = s || null; renderMode(); renderResults(); }).catch(()=>{}); } catch(e){}
  try { C.use("assets").then(a => { S.assets = a || null; }).catch(()=>{}); } catch(e){}
  let db = null, user = null;
  try { [db, user] = await Promise.all([C.use("db"), C.use("user")]); } catch(e){}
  let uid = null; try { uid = user ? await user.id() : null; } catch(e){}
  if (!db || !uid){ startLocal(); return; }
  S.db = db; S.user = user; S.uid = uid; S.live = true;
  // 내 답변
  try { const snap = await db.doc("answers/"+uid).get(); if (snap.exists){ S.my = snap.data(); } } catch(e){}
  S.loading = false; renderAll();
  const timer = setTimeout(() => { S.timedOut = true; renderMode(); }, 10000);
  subscribeAnswers(timer);
  db.collection("posts").onSnapshot(snap => {
    const out = [];
    snap.docs.forEach(d => { const items = (d.data()||{}).items; if (Array.isArray(items)) items.slice(0,30).forEach(p => { const c = cleanPost(p, d.id); if (c) out.push(c); }); if (d.id === uid) S.myPosts = Array.isArray(items) ? items.slice() : []; });
    S.posts = out; if (S.tab === "community") renderCommunity();
  }, err => console.warn(err));
  db.doc("weather/current").onSnapshot(snap => {
    if (!snap.exists) return;
    const v = snap.data();
    if (v && v.gu && GU.every(g => v.gu[g] && typeof v.gu[g].t === "number") && Date.now() - (v.updatedAt||0) < 3*3600e3){
      W = withFeels({source: v.source || "기상청 초단기실황", updatedAt: v.updatedAt, gu: JSON.parse(JSON.stringify(v.gu)), demo:false});
      renderAll();
    }
  }, () => {});
}

$("#simToggle").checked = S.sim;
renderAll();
connect();
</script>
